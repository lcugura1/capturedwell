<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&amp;display=swap">
  <style>
    body { margin: 0; background: #080808; color: #ededed; font-family: 'Quicksand', 'Nunito', 'Varela Round', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #a3a3a3; text-decoration: none; } a:hover { color: #ededed; }
    img { display: block; }
  </style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="Pregled fotografije" style="position: relative; width: 1440px; height: 900px; background: #080808; overflow: hidden;">

  <!-- Photo, contained -->
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 96px 136px; box-sizing: border-box;">
    <img src="dogadaji-krstenje.jpg" alt="Otac drži bebu dok joj stariji brat pruža ruku na krštenju" style="max-width: 100%; max-height: 100%; width: 1062px; height: 708px; object-fit: contain;">
  </div>

  <!-- Top bar -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 96px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;">
      <span style="display: flex; align-items: center; gap: 10px;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #ededed;"></span><span>događaji</span></span>
      <span style="color: #808080;">7 / 10</span>
    </div>
    <button aria-label="Zatvori" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border-radius: 999px; border: 1px solid #606060; background: transparent; color: #ededed; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
    </button>
  </div>

  <!-- Prev / next -->
  <button aria-label="Prethodna fotografija" style="position: absolute; left: 40px; top: 422px; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; padding: 0; border-radius: 999px; border: 1px solid #606060; background: transparent; color: #ededed; cursor: pointer;">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>
  </button>
  <button aria-label="Sljedeća fotografija" style="position: absolute; right: 40px; top: 422px; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; padding: 0; border-radius: 999px; border: none; background: #ededed; color: #0c0c0c; cursor: pointer; outline: 2px solid #ededed; outline-offset: 3px;">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"></path></svg>
  </button>

  <!-- Keyboard hint -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 12px; font-weight: 500; color: #808080;">
    <span style="display: flex; align-items: center; gap: 6px;"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"></path></svg><span>listanje</span></span>
    <span style="width: 3px; height: 3px; border-radius: 999px; background: #808080;"></span>
    <span>esc zatvaranje</span>
  </div>
</div>
</x-dc>
</body>
</html>
